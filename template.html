<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fairfield Dynasty · Value Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #08090B;
    --row: #0E1013;
    --row-alt: #0B0D0F;
    --line: #1C2024;
    --cyan: #2DE0FF;
    --cyan-dim: #0F8DA8;
    --ink: #E8ECEF;
    --muted: #6B7480;
    --muted2: #454C54;
    --pos-qb: #4C8DFF;
    --pos-rb: #FF9B4C;
    --pos-wr: #C77DFF;
    --pos-te: #2DE0FF;
    --pos-idp: #FF6B8B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overscroll-behavior-y: contain;
  }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(8,9,11,0.92);
    backdrop-filter: blur(8px);
    padding: calc(env(safe-area-inset-top) + 12px) 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .ticker-row {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 10px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan);
  }
  h1 {
    font-weight: 800; font-size: 21px; letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .weights-caption {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--muted2); margin-bottom: 10px;
  }

  .searchrow { display: flex; gap: 8px; margin-bottom: 8px; }
  .searchbox {
    flex: 1; background: var(--row); border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 11px; color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13.5px;
  }
  .searchbox::placeholder { color: var(--muted2); }
  .searchbox:focus { outline: 1px solid var(--cyan-dim); outline-offset: -1px; }
  select {
    background: var(--row); border: 1px solid var(--line); border-radius: 6px;
    color: var(--ink); font-family: 'Inter', sans-serif; font-size: 12.5px; padding: 9px 6px;
  }

  .chiprow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; appearance: none; border: 1px solid var(--line); background: var(--row);
    color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 6px 11px; border-radius: 4px;
  }
  .chip.active { background: var(--cyan); border-color: var(--cyan); color: #032027; font-weight: 700; }

  .colheader {
    display: grid;
    grid-template-columns: 28px 34px 1fr 52px 14px;
    gap: 8px;
    padding: 8px 14px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--muted2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--line);
  }
  .colheader .r { text-align: right; }

  #list { padding-bottom: 40px; }

  .row { border-bottom: 1px solid var(--line); }
  .row:nth-child(even) .rowmain { background: var(--row-alt); }

  .rowmain {
    display: grid;
    grid-template-columns: 28px 34px 1fr 52px 14px;
    gap: 8px;
    align-items: center;
    padding: 10px 14px;
  }
  .rank { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted2); }

  .pos-pill {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 10px;
    text-align: center; padding: 2px 0; border-radius: 3px; color: #06090B;
  }
  .pos-QB { background: var(--pos-qb); }
  .pos-RB { background: var(--pos-rb); }
  .pos-WR { background: var(--pos-wr); }
  .pos-TE { background: var(--pos-te); }
  .pos-IDP { background: var(--pos-idp); }

  .info { min-width: 0; }
  .pname {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .psub {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 1px;
  }

  .score {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px;
    text-align: right;
  }
  .score.tier-elite { color: var(--cyan); }
  .score.tier-solid { color: #8FE8F5; }
  .score.tier-deep { color: var(--muted); }
  .score.tier-none { color: var(--muted2); font-size: 13px; }

  .chev { color: var(--muted2); font-size: 10px; transition: transform 0.15s; }
  .row.open .chev { transform: rotate(90deg); color: var(--cyan); }

  .detail { display: none; padding: 4px 14px 16px; background: var(--row-alt); }
  .row.open .detail { display: block; }

  .bars { margin-top: 8px; }
  .barline { display: grid; grid-template-columns: 76px 1fr 30px; align-items: center; gap: 8px; margin-bottom: 6px; }
  .barlabel { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .bartrack { height: 5px; background: var(--bg); border-radius: 2px; overflow: hidden; }
  .barfill { height: 100%; background: var(--cyan); border-radius: 2px; }
  .barval { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); text-align: right; }

  .ctx {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
  }
  .ctxitem { font-size: 11px; color: var(--muted); }
  .ctxitem b { color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

  .nodata-note { margin-top: 8px; font-size: 11px; color: var(--muted); font-style: italic; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted2); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }

  footer {
    text-align: center; padding: 14px 20px 30px; font-size: 10px; color: var(--muted2);
    font-family: 'IBM Plex Mono', monospace; line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <div class="ticker-row">
    <span class="dot"></span>
    <span class="eyebrow">Fairfield Dynasty · Live</span>
  </div>
  <h1>Value Board</h1>
  <div class="weights-caption">production 65 · consistency 22 · durability 8 · age 5</div>

  <div class="searchrow">
    <input class="searchbox" id="search" type="text" placeholder="Search player…" autocomplete="off">
    <select id="teamFilter"><option value="">All Teams</option></select>
  </div>
  <div class="chiprow" id="posChips"></div>
</header>

<div class="colheader">
  <div>#</div><div>POS</div><div>PLAYER</div><div class="r">SCORE</div><div></div>
</div>
<div id="list"></div>

<footer>
  Score blends production, consistency, durability, and age — production and consistency weighted heaviest.<br>
  Tap any row for the full breakdown.
</footer>

<script src="players_data.js"></script>
<script>
const DATA = (typeof PLAYERS !== 'undefined') ? PLAYERS : [];

const WEIGHTS = {production:0.65, consistency:0.22, durability:0.08, age:0.05};

const YOUTH_CURVE = [
  [22.0,100.0],[24.0,92.0],[25.0,88.0],[27.0,74.0],[28.0,62.0],
  [29.0,50.0],[30.0,40.0],[31.0,30.0],[32.0,22.0],[34.0,12.0],[37.0,6.0]
];
function youthScoreFromAge(age) {
  if (age === null || age === undefined || isNaN(age)) return null;
  const lo = YOUTH_CURVE[0], hi = YOUTH_CURVE[YOUTH_CURVE.length-1];
  if (age <= lo[0]) return lo[1];
  if (age >= hi[0]) return hi[1];
  for (let i=0; i<YOUTH_CURVE.length-1; i++) {
    const [a1,s1] = YOUTH_CURVE[i], [a2,s2] = YOUTH_CURVE[i+1];
    if (age >= a1 && age <= a2) {
      const frac = (age-a1)/(a2-a1);
      return Math.round((s1 + frac*(s2-s1))*10)/10;
    }
  }
  return hi[1];
}

let currentPos = 'ALL';
let currentTeam = '';
let currentSearch = '';

const IDP_POS = new Set(['LB','DB','DL','DE','DT','CB','S']);
function posGroupOf(pos) { return IDP_POS.has(pos) ? 'IDP' : (pos || 'UNK'); }
function posGroup(p) { return posGroupOf(p.p); }

function normalizeGlobal(getVal, invert) {
  const vals = DATA.map(getVal).filter(v => v !== null && v !== undefined && !isNaN(v));
  const out = {};
  if (vals.length < 2 || (Math.max(...vals) - Math.min(...vals)) === 0) {
    DATA.forEach((p, i) => {
      const v = getVal(p);
      out[i] = (v !== null && v !== undefined && !isNaN(v)) ? 50 : null;
    });
    return out;
  }
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  DATA.forEach((p, i) => {
    const v = getVal(p);
    if (v === null || v === undefined || isNaN(v)) { out[i] = null; return; }
    let score = (v - lo) / span * 100;
    out[i] = invert ? (100 - score) : score;
  });
  return out;
}

const prodScore = normalizeGlobal(p => p.prod, false);
const youthScore = {};
DATA.forEach((p, i) => { youthScore[i] = youthScoreFromAge(p.age); });
const durScore = normalizeGlobal(p => p.dur, false);
const conScore = normalizeGlobal(p => p.con, true);

DATA.forEach((p, i) => {
  p._prodS = prodScore[i]; p._youthS = youthScore[i]; p._durS = durScore[i]; p._conS = conScore[i];
  p._hasAll = [p._prodS, p._youthS, p._durS, p._conS].every(v => v !== null && v !== undefined);
});

function computeScore(p) {
  if (!p._hasAll) return null;
  const w = WEIGHTS;
  return p._prodS*w.production + p._youthS*w.age + p._durS*w.durability + p._conS*w.consistency;
}

function tierFor(score) {
  if (score === null) return 'none';
  if (score >= 75) return 'elite';
  if (score >= 55) return 'solid';
  return 'deep';
}

const teams = [...new Set(DATA.map(p => p.ft))].sort();
const teamSelect = document.getElementById('teamFilter');
teams.forEach(t => { const o=document.createElement('option'); o.value=t; o.textContent=t; teamSelect.appendChild(o); });
teamSelect.addEventListener('change', () => { currentTeam = teamSelect.value; render(); });

const POS_ORDER = ['ALL','QB','RB','WR','TE','IDP'];
const chipRow = document.getElementById('posChips');
POS_ORDER.forEach(pos => {
  const b = document.createElement('button');
  b.className = 'chip' + (pos === 'ALL' ? ' active' : '');
  b.textContent = pos; b.dataset.pos = pos;
  b.addEventListener('click', () => {
    currentPos = pos;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.pos === pos));
    render();
  });
  chipRow.appendChild(b);
});

document.getElementById('search').addEventListener('input', (e) => {
  currentSearch = e.target.value.trim().toLowerCase();
  render();
});

function fmt(v, decimals=1) {
  if (v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return Number(v).toFixed(decimals);
}

function positionContext(p) {
  const grp = posGroupOf(p.p);
  const item = (label, val) => (val !== null && val !== undefined && !isNaN(val))
    ? `<div class="ctxitem">${label} <b>${val}</b></div>` : '';
  if (grp === 'QB') {
    return item('Pass yds/game', p.pyg !== null ? fmt(p.pyg, 0) : null)
         + item('Pass EPA/game', p.pepa !== null ? fmt(p.pepa, 1) : null)
         + item('Rush yds/game', p.ryg !== null ? fmt(p.ryg, 1) : null);
  }
  if (grp === 'RB') {
    return item('Carries/game', p.cpg !== null ? fmt(p.cpg, 1) : null)
         + item('Rush yds/game', p.ryg !== null ? fmt(p.ryg, 1) : null)
         + (p.ts !== null ? item('Target share', fmt(p.ts*100, 1) + '%') : '');
  }
  if (grp === 'WR' || grp === 'TE') {
    return (p.ts !== null ? item('Target share', fmt(p.ts*100, 1) + '%') : '')
         + item('WOPR', p.wopr !== null ? fmt(p.wopr, 2) : null);
  }
  return '';
}

function render() {
  let filtered = DATA.filter(p => {
    if (currentPos !== 'ALL' && posGroup(p) !== currentPos) return false;
    if (currentTeam && p.ft !== currentTeam) return false;
    if (currentSearch && !p.n.toLowerCase().includes(currentSearch)) return false;
    return true;
  });
  filtered.forEach(p => { p._score = computeScore(p); });
  filtered.sort((a,b) => (a._score===null?-1:a._score) < (b._score===null?-1:b._score) ? 1 : -1);

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No players match.</div>';
    return;
  }

  filtered.forEach((p, idx) => {
    const tier = tierFor(p._score);
    const row = document.createElement('div');
    row.className = 'row';
    const scoreDisplay = p._score === null ? '—' : Math.round(p._score);

    row.innerHTML = `
      <div class="rowmain">
        <div class="rank mono">${idx+1}</div>
        <div class="pos-pill pos-${posGroup(p)}">${p.p}</div>
        <div class="info">
          <div class="pname">${p.n}</div>
          <div class="psub">${p.t} · ${p.ft}</div>
        </div>
        <div class="score tier-${tier}">${scoreDisplay}</div>
        <div class="chev">▶</div>
      </div>
      <div class="detail">
        ${p._hasAll ? `
        <div class="bars">
          <div class="barline"><div class="barlabel">Production</div><div class="bartrack"><div class="barfill" style="width:${p._prodS}%"></div></div><div class="barval mono">${Math.round(p._prodS)}</div></div>
          <div class="barline"><div class="barlabel">Consistency</div><div class="bartrack"><div class="barfill" style="width:${p._conS}%"></div></div><div class="barval mono">${Math.round(p._conS)}</div></div>
          <div class="barline"><div class="barlabel">Durability</div><div class="bartrack"><div class="barfill" style="width:${p._durS}%"></div></div><div class="barval mono">${Math.round(p._durS)}</div></div>
          <div class="barline"><div class="barlabel">Age</div><div class="bartrack"><div class="barfill" style="width:${p._youthS}%"></div></div><div class="barval mono">${Math.round(p._youthS)}</div></div>
        </div>` : `<div class="nodata-note">Not enough data for a full score.</div>`}
        <div class="ctx">
          <div class="ctxitem">Age <b>${fmt(p.age)}</b></div>
          <div class="ctxitem">Real Fairfield PPG <b>${fmt(p.affg)}</b></div>
          ${positionContext(p)}
          ${p.tor !== null ? `<div class="ctxitem">Team offense rank <b>#${p.tor}</b></div>` : ''}
        </div>
      </div>
    `;
    row.querySelector('.rowmain').addEventListener('click', () => {
      const wasOpen = row.classList.contains('open');
      document.querySelectorAll('.row.open').forEach(r => r.classList.remove('open'));
      if (!wasOpen) row.classList.add('open');
    });
    list.appendChild(row);
  });
}
render();
</script>
</body>
</html>
