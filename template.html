<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fairfield Dynasty · Value Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #12140F;
    --panel: #1A1E14;
    --panel2: #21261A;
    --line: #2B3122;
    --turf: #5FB562;
    --turf-dim: #3E7A42;
    --gold: #E3B341;
    --rust: #C1553D;
    --ink: #EDEFE6;
    --muted: #8B9284;
    --muted2: #626856;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overscroll-behavior-y: contain;
  }

  body {
    padding-bottom: env(safe-area-inset-bottom);
  }

  .display { font-family: 'Barlow Condensed', sans-serif; }
  .mono { font-family: 'Space Mono', monospace; }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, var(--bg) 70%, rgba(18,20,15,0.94));
    padding: calc(env(safe-area-inset-top) + 14px) 16px 10px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--turf);
    margin-bottom: 2px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.01em;
    line-height: 1;
    margin-bottom: 12px;
  }

  /* ---------- Lens toggle ---------- */
  .lens {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
    margin-bottom: 10px;
  }
  .lens button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    padding: 9px 4px;
    border-radius: 7px;
    transition: background 0.15s, color 0.15s;
  }
  .lens button.active {
    background: var(--turf-dim);
    color: #fff;
  }
  .lens-sub {
    font-size: 10.5px;
    color: var(--muted2);
    text-align: center;
    margin-bottom: 12px;
    font-family: 'Space Mono', monospace;
  }

  /* ---------- Search + filters ---------- */
  .searchrow {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .searchbox {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 12px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .searchbox::placeholder { color: var(--muted2); }
  .searchbox:focus { outline: 2px solid var(--turf-dim); outline-offset: -1px; }

  select {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 9px 8px;
  }

  .chiprow {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .chip.active {
    background: var(--turf);
    border-color: var(--turf);
    color: #0d1a0d;
    font-weight: 700;
  }

  .resultcount {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--muted2);
    padding: 10px 16px 4px;
  }

  /* ---------- Player list ---------- */
  #list { padding: 4px 12px 40px; }

  .row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 11px;
    margin-bottom: 7px;
    overflow: hidden;
  }

  .rowmain {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
  }

  .rank {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted2);
    width: 20px;
    flex-shrink: 0;
    text-align: center;
  }

  .badge {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 16px;
    border: 2px solid;
  }
  .badge.tier-elite { border-color: var(--gold); color: var(--gold); background: rgba(227,179,65,0.08); }
  .badge.tier-solid { border-color: var(--turf); color: var(--turf); background: rgba(95,181,98,0.08); }
  .badge.tier-deep  { border-color: var(--muted2); color: var(--muted); background: rgba(139,146,132,0.06); }
  .badge.tier-none  { border-color: var(--line); color: var(--muted2); background: none; font-size: 13px; }

  .info { flex: 1; min-width: 0; }
  .pname {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .psub {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pos-pill {
    display: inline-block;
    font-weight: 700;
    color: var(--ink);
  }

  .chev {
    color: var(--muted2);
    font-size: 12px;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .row.open .chev { transform: rotate(90deg); }

  /* ---------- Expanded detail ---------- */
  .detail {
    display: none;
    padding: 2px 14px 14px;
    border-top: 1px solid var(--line);
  }
  .row.open .detail { display: block; }

  .bars { margin-top: 10px; }
  .barline {
    display: grid;
    grid-template-columns: 80px 1fr 30px;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .barlabel {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .bartrack {
    height: 7px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .barfill {
    height: 100%;
    border-radius: 4px;
    background: var(--turf);
  }
  .barval {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    text-align: right;
  }

  .ctx {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .ctxitem {
    font-size: 11.5px;
    color: var(--muted);
  }
  .ctxitem b {
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    font-weight: 400;
  }

  .nodata-note {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--rust);
    font-style: italic;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted2);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
  }

  footer {
    text-align: center;
    padding: 10px 20px 30px;
    font-size: 10.5px;
    color: var(--muted2);
    font-family: 'Space Mono', monospace;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Fairfield Dynasty League</div>
  <h1>Value Board</h1>

  <div class="lens" role="tablist">
    <button class="lens-btn" data-lens="rebuild">Rebuild</button>
    <button class="lens-btn active" data-lens="balanced">Balanced</button>
    <button class="lens-btn" data-lens="contender">Contender</button>
  </div>
  <div class="lens-sub" id="lensSub">production 50 · age 20 · durability 15 · consistency 15</div>

  <div class="searchrow">
    <input class="searchbox" id="search" type="text" placeholder="Search player…" autocomplete="off">
    <select id="teamFilter"><option value="">All Teams</option></select>
  </div>
  <div class="chiprow" id="posChips"></div>
</header>

<div class="resultcount" id="resultCount"></div>
<div id="list"></div>

<footer>
  Dynasty score blends production, age, durability, and week-to-week consistency —<br>
  weighted by whichever lens is selected above. Tap any player for the breakdown.
</footer>

<script>
const PLACEHOLDER_DATA = [];
</script>
<script src="players_data.js"></script>
<script>
const DATA = (typeof PLAYERS !== 'undefined') ? PLAYERS : PLACEHOLDER_DATA;

const WEIGHTS = {
  balanced:  {production:0.56, age:0.14, durability:0.15, consistency:0.15},
  contender: {production:0.68, age:0.04, durability:0.14, consistency:0.14},
  rebuild:   {production:0.34, age:0.36, durability:0.15, consistency:0.15},
};
const LENS_LABELS = {
  balanced:  "production 56 · age 14 · durability 15 · consistency 15",
  contender: "production 68 · age 4 · durability 14 · consistency 14",
  rebuild:   "production 34 · age 36 · durability 15 · consistency 15",
};

// Youth curve -- must match YOUTH_CURVE in 07_build_final_value_board.py.
// Maps a real age to a 0-100 youth score so young players cluster near the
// top without the single youngest running away with a perfect 100.
const YOUTH_CURVE = [
  [22.0,100.0],[24.0,92.0],[25.0,88.0],[27.0,74.0],[28.0,62.0],
  [29.0,50.0],[30.0,40.0],[31.0,30.0],[32.0,22.0],[34.0,12.0],[37.0,6.0]
];
function youthScoreFromAge(age) {
  if (age === null || age === undefined || isNaN(age)) return null;
  const lo = YOUTH_CURVE[0], hi = YOUTH_CURVE[YOUTH_CURVE.length-1];
  if (age <= lo[0]) return lo[1];
  if (age >= hi[0]) return hi[1];
  for (let i=0; i<YOUTH_CURVE.length-1; i++) {
    const [a1,s1] = YOUTH_CURVE[i], [a2,s2] = YOUTH_CURVE[i+1];
    if (age >= a1 && age <= a2) {
      const frac = (age-a1)/(a2-a1);
      return Math.round((s1 + frac*(s2-s1))*10)/10;
    }
  }
  return hi[1];
}

let currentLens = 'balanced';
let currentPos = 'ALL';
let currentTeam = '';
let currentSearch = '';
let openRow = null;

const IDP_POS = new Set(['LB','DB','DL','DE','DT','CB','S']);

function posGroupOf(pos) {
  return IDP_POS.has(pos) ? 'IDP' : (pos || 'UNK');
}

// Normalize a metric to 0-100 SEPARATELY within each position group, so a
// player is scored against others at his own position. Mirrors the Python
// in 07_build_final_value_board.py exactly. A player alone in his group (or
// a group with no spread) lands at a neutral 50.
function normalizeWithinPosition(getVal, invert) {
  const groups = {};
  DATA.forEach((p, i) => {
    const g = posGroupOf(p.p);
    (groups[g] = groups[g] || []).push(i);
  });

  const out = {};
  for (const g in groups) {
    const idxs = groups[g];
    const vals = idxs.map(i => getVal(DATA[i])).filter(v => v !== null && v !== undefined && !isNaN(v));
    if (vals.length < 2 || (Math.max(...vals) - Math.min(...vals)) === 0) {
      idxs.forEach(i => {
        const v = getVal(DATA[i]);
        out[i] = (v !== null && v !== undefined && !isNaN(v)) ? 50 : null;
      });
    } else {
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const span = (hi - lo) || 1;
      idxs.forEach(i => {
        const v = getVal(DATA[i]);
        if (v === null || v === undefined || isNaN(v)) { out[i] = null; return; }
        let score = (v - lo) / span * 100;
        out[i] = invert ? (100 - score) : score;
      });
    }
  }
  return out;
}

// Precompute the four component scores ONCE, each within position (lens-independent)
const prodScore = normalizeWithinPosition(p => p.prod, false);
const youthScore = {};
DATA.forEach((p, i) => { youthScore[i] = youthScoreFromAge(p.age); });
const durScore = normalizeWithinPosition(p => p.dur, false);
const conScore = normalizeWithinPosition(p => p.con, true);

DATA.forEach((p, i) => {
  p._prodS = prodScore[i];
  p._youthS = youthScore[i];
  p._durS = durScore[i];
  p._conS = conScore[i];
  p._hasAll = [p._prodS, p._youthS, p._durS, p._conS].every(v => v !== null && v !== undefined);
});

function computeScore(p, lens) {
  if (!p._hasAll) return null;
  const w = WEIGHTS[lens];
  return p._prodS*w.production + p._youthS*w.age + p._durS*w.durability + p._conS*w.consistency;
}

function tierFor(score) {
  if (score === null) return 'none';
  if (score >= 75) return 'elite';
  if (score >= 55) return 'solid';
  return 'deep';
}

function posGroup(p) {
  return IDP_POS.has(p.p) ? 'IDP' : p.p;
}

// ---- Build filter controls ----
const teams = [...new Set(DATA.map(p => p.ft))].sort();
const teamSelect = document.getElementById('teamFilter');
teams.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = t;
  teamSelect.appendChild(opt);
});
teamSelect.addEventListener('change', () => { currentTeam = teamSelect.value; render(); });

const POS_ORDER = ['ALL','QB','RB','WR','TE','IDP'];
const chipRow = document.getElementById('posChips');
POS_ORDER.forEach(pos => {
  const b = document.createElement('button');
  b.className = 'chip' + (pos === 'ALL' ? ' active' : '');
  b.textContent = pos;
  b.dataset.pos = pos;
  b.addEventListener('click', () => {
    currentPos = pos;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.pos === pos));
    render();
  });
  chipRow.appendChild(b);
});

document.querySelectorAll('.lens-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLens = btn.dataset.lens;
    document.querySelectorAll('.lens-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('lensSub').textContent = LENS_LABELS[currentLens];
    render();
  });
});

document.getElementById('search').addEventListener('input', (e) => {
  currentSearch = e.target.value.trim().toLowerCase();
  render();
});

function fmt(v, decimals=1) {
  if (v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return Number(v).toFixed(decimals);
}

function render() {
  let filtered = DATA.filter(p => {
    if (currentPos !== 'ALL' && posGroup(p) !== currentPos) return false;
    if (currentTeam && p.ft !== currentTeam) return false;
    if (currentSearch && !p.n.toLowerCase().includes(currentSearch)) return false;
    return true;
  });

  filtered.forEach(p => { p._score = computeScore(p, currentLens); });
  filtered.sort((a,b) => {
    const as = a._score === null ? -1 : a._score;
    const bs = b._score === null ? -1 : b._score;
    return bs - as;
  });

  document.getElementById('resultCount').textContent = `${filtered.length} players`;

  const list = document.getElementById('list');
  list.innerHTML = '';

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No players match. Try a different search or filter.</div>';
    return;
  }

  filtered.forEach((p, idx) => {
    const tier = tierFor(p._score);
    const row = document.createElement('div');
    row.className = 'row';

    const scoreDisplay = p._score === null ? '—' : Math.round(p._score);

    row.innerHTML = `
      <div class="rowmain">
        <div class="rank mono">${idx+1}</div>
        <div class="badge tier-${tier} display">${scoreDisplay}</div>
        <div class="info">
          <div class="pname">${p.n}</div>
          <div class="psub"><span class="pos-pill">${p.p}</span> · ${p.t} · ${p.ft}</div>
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="detail">
        ${p._hasAll ? `
        <div class="bars">
          <div class="barline">
            <div class="barlabel">Production</div>
            <div class="bartrack"><div class="barfill" style="width:${p._prodS}%"></div></div>
            <div class="barval mono">${Math.round(p._prodS)}</div>
          </div>
          <div class="barline">
            <div class="barlabel">Youth</div>
            <div class="bartrack"><div class="barfill" style="width:${p._youthS}%"></div></div>
            <div class="barval mono">${Math.round(p._youthS)}</div>
          </div>
          <div class="barline">
            <div class="barlabel">Durability</div>
            <div class="bartrack"><div class="barfill" style="width:${p._durS}%"></div></div>
            <div class="barval mono">${Math.round(p._durS)}</div>
          </div>
          <div class="barline">
            <div class="barlabel">Consistency</div>
            <div class="bartrack"><div class="barfill" style="width:${p._conS}%"></div></div>
            <div class="barval mono">${Math.round(p._conS)}</div>
          </div>
        </div>` : `<div class="nodata-note">Not enough data for a full score (missing age, production, durability, or consistency history).</div>`}
        <div class="ctx">
          <div class="ctxitem">Age <b>${fmt(p.age)}</b></div>
          <div class="ctxitem">Real Fairfield PPG <b>${fmt(p.affg)}</b></div>
          <div class="ctxitem">Avg games/yr <b>${fmt(p.dur)}</b></div>
          <div class="ctxitem">Weekly variance <b>${fmt(p.con)}</b></div>
          ${p.ts !== null ? `<div class="ctxitem">Target share <b>${fmt(p.ts*100,1)}%</b></div>` : ''}
          ${p.tor !== null ? `<div class="ctxitem">Team offense rank <b>#${p.tor}</b></div>` : ''}
        </div>
      </div>
    `;

    row.querySelector('.rowmain').addEventListener('click', () => {
      const wasOpen = row.classList.contains('open');
      document.querySelectorAll('.row.open').forEach(r => r.classList.remove('open'));
      if (!wasOpen) row.classList.add('open');
    });

    list.appendChild(row);
  });
}

render();
</script>
</body>
</html>
